<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Temp helper</title></head>
<body style="margin:0">
<button id="full" style="position:fixed;inset:0;width:100vw;height:100vh;border:none;background:#e91e63;color:#fff;font-size:30px;display:block;cursor:pointer;text-align:center;word-break:break-all;padding:40px">TAP ANYWHERE TO READ CLIPBOARD</button>
<script>
var f=document.getElementById('full');
f.addEventListener('click',async function(){
  f.textContent='CLICK REGISTERED, focusing...';
  window.focus();
  for(var i=0;i<40;i++){
    if(document.hasFocus()){
      f.textContent='FOCUSED, reading clipboard...';
      try{
        var t=await navigator.clipboard.readText();
        f.textContent='RESULT['+t+']';
        return;
      }catch(e){
        f.textContent='ERR '+e.name+' '+e.message;
        return;
      }
    }
    f.textContent='waiting for focus... attempt '+i;
    await new Promise(r=>setTimeout(r,300));
    if(i%5===0){window.focus();}
  }
  f.textContent='ERR timeout: tab never got focus. Click this tab then click here again.';
});
</script>
</body>
</html>
