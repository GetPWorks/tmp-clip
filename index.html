<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Helper</title></head>
<body style="margin:0;font-family:Arial,sans-serif">
<div id="stage" style="position:fixed;inset:0;background:#607d8b;color:#fff;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px"></div>
<script>
var stage=document.getElementById('stage');
var url=location.href.split('?')[0];
async function readClip(){try{return await navigator.clipboard.readText();}catch(e){return 'ERR '+e.name+' '+e.message;}}
function send(t){if(window.opener&&!window.opener.closed){try{window.opener.postMessage('CLIPRESULT:'+t,'*');}catch(e){}}}
if(location.search.indexOf('popup=1')!==-1){
  stage.style.background='#4CAF50';
  stage.innerHTML='<div style="font-size:30px;font-weight:bold;margin-bottom:20px">ONE CLICK NEEDED</div><div style="font-size:22px;margin-bottom:30px">Click the big button below.<br>If Chrome asks to see your clipboard, click ALLOW.</div><button id="go" style="font-size:34px;padding:30px 60px;background:#fff;color:#222;border:none;cursor:pointer;font-weight:bold">READ CLIPBOARD</button><div id="out" style="margin-top:30px;font-size:18px"></div>';
  document.getElementById('go').onclick=async function(){
    var t=await readClip();
    document.getElementById('out').textContent='RESULT['+t+']';
    send(t);
  };
  (async function(){var t=await readClip();if(t&&t.indexOf('ERR ')!==0){send(t);document.getElementById('out').textContent='RESULT['+t+']';}})();
}else{
  var wins={};
  stage.innerHTML='<div style="font-size:28px;font-weight:bold;margin-bottom:24px">Clipboard / Square helper</div>';
  function mkBtn(label,fn,id){var b=document.createElement('button');b.textContent=label;b.id=id||('btn'+Math.random());b.style.cssText='font-size:22px;padding:18px 36px;background:#fff;color:#222;border:none;cursor:pointer;font-weight:bold;margin:8px';b.onclick=fn;stage.appendChild(b);return b;}
  mkBtn('OPEN SQUARE WINDOW',function(){wins.sq=window.open('https://developer.squareup.com/console/en/apps/sq0idp-HMzTde_WWTCfIUXKqLV2GQ/oauth','sq'+Date.now(),'width=1400,height=1000');},'openSq');
  mkBtn('FOCUS SQUARE',function(){if(wins.sq&&!wins.sq.closed){wins.sq.focus();}else{alert('no sq win');}},'focusSq');
  mkBtn('OPEN READER',function(){wins.rd=window.open(url+'?popup=1&t='+Date.now(),'rd'+Date.now(),'width=950,height=750');},'openRd');
  mkBtn('FOCUS READER',function(){if(wins.rd&&!wins.rd.closed){wins.rd.focus();}else{alert('no rd win');}},'focusRd');
  var res=document.createElement('div');res.id='res';res.style.cssText='margin-top:24px;font-size:20px;color:#ff0;font-weight:bold';stage.appendChild(res);
  window.addEventListener('message',function(e){if(typeof e.data==='string'&&e.data.indexOf('CLIPRESULT:')===0){res.textContent='RESULT['+e.data.substring(11)+']';}});
}
</script>
</body>
</html>
