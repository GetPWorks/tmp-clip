<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Temp helper</title></head>
<body style="margin:0">
<div id="full" style="position:fixed;inset:0;background:#e91e63;color:#fff;font-size:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center;padding:20px">TAP ANYWHERE TO READ CLIPBOARD</div>
<div id="o" style="display:none"></div>
<script>
var f=document.getElementById('full');
f.onclick=async function(){try{var t=await navigator.clipboard.readText();f.style.fontSize='24px';f.style.wordBreak='break-all';f.textContent='RESULT['+t+']';}catch(e){f.textContent='ERR '+e.name+' '+e.message;}};
</script>
</body>
</html>
