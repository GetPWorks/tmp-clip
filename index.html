<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Temp helper</title></head>
<body style="margin:0">
<button id="full" style="position:fixed;inset:0;width:100vw;height:100vh;border:none;background:#e91e63;color:#fff;font-size:32px;display:block;cursor:pointer;text-align:center;word-break:break-all;padding:40px">TAP ANYWHERE TO READ CLIPBOARD</button>
<script>
var f=document.getElementById('full');
f.addEventListener('click',async function(){
  f.textContent='CLICK REGISTERED, calling readText...';
  try{
    var t=await navigator.clipboard.readText();
    f.textContent='RESULT['+t+']';
  }catch(e){
    f.textContent='ERR '+e.name+' '+e.message;
  }
});
</script>
</body>
</html>
